<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIZA — DOCTOR (WebAssembly)</title>
<style>
  :root{
    --paper:#e9e3d2;        /* manila teletype stock           */
    --paper-edge:#ddd5bf;   /* slightly shaded toward margins  */
    --ink:#26221b;          /* black ribbon, warmed            */
    --ink-soft:#6f6552;     /* faded ink for labels/prompts    */
    --ribbon:#8a3324;       /* oxblood — the second ribbon      */
    --desk:#26241f;         /* the desk the paper sits on      */
    --hole:#26241f;         /* sprocket hole color             */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #322f28 0%, var(--desk) 55%, #1d1b17 100%);
    color:var(--ink);
    font-family:"Courier New",Courier,ui-monospace,SFMono-Regular,Menlo,monospace;
    display:flex; justify-content:center;
    padding:clamp(0px,3vw,40px) clamp(0px,3vw,40px);
  }

  /* --- the roll of paper --- */
  .paper{
    position:relative;
    width:min(760px,100%);
    height:calc(100dvh - clamp(0px,6vw,80px));
    background:
      linear-gradient(90deg,var(--paper-edge) 0 34px, var(--paper) 34px calc(100% - 34px), var(--paper-edge) calc(100% - 34px) 100%);
    box-shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 0 rgba(255,255,255,.06) inset;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  /* punched sprocket margins, left and right */
  .paper::before,.paper::after{
    content:""; position:absolute; top:0; bottom:0; width:34px;
    background-image:radial-gradient(circle, var(--hole) 0 3.1px, transparent 3.6px);
    background-size:34px 26px; background-position:center 8px;
    opacity:.5; pointer-events:none;
  }
  .paper::before{left:0} .paper::after{right:0}

  /* --- printed header (a form-feed banner) --- */
  .head{
    flex:0 0 auto;
    padding:18px 52px 12px;
    border-bottom:1px solid rgba(38,34,27,.28);
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft);
  }
  .head b{color:var(--ink); letter-spacing:.28em}
  .head .meta{font-size:10px; letter-spacing:.16em; white-space:nowrap}

  /* --- the transcript / print-out --- */
  .roll{
    flex:1 1 auto; overflow-y:auto;
    padding:20px 52px 8px;
    font-size:15px; line-height:1.7;
    scrollbar-width:thin; scrollbar-color:rgba(38,34,27,.35) transparent;
  }
  .roll::-webkit-scrollbar{width:9px}
  .roll::-webkit-scrollbar-thumb{background:rgba(38,34,27,.30)}

  .line{white-space:pre-wrap; word-break:break-word; margin:0 0 .55em}
  .line .tag{
    color:var(--ribbon); font-weight:700; letter-spacing:.12em;
    margin-right:.6ch;
  }
  .line.you{color:var(--ink)}
  .line.you .prompt{color:var(--ink-soft); margin-right:.6ch}
  .line.sys{color:var(--ink-soft); font-style:italic}

  .caret{
    display:inline-block; width:.62ch; height:1.05em; vertical-align:-.18em;
    background:var(--ribbon); margin-left:.06ch;
    animation:blink 1.06s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  /* --- the carriage / input line --- */
  .carriage{
    flex:0 0 auto;
    padding:12px 52px 20px;
    border-top:1px solid rgba(38,34,27,.28);
    display:flex; align-items:center; gap:.6ch;
    font-size:15px;
  }
  .carriage .prompt{color:var(--ink-soft)}
  .carriage input{
    flex:1 1 auto; min-width:0;
    background:transparent; border:0; outline:0;
    color:var(--ink); caret-color:var(--ribbon);
    font:inherit; padding:2px 0;
  }
  .carriage input::placeholder{color:var(--ink-soft); opacity:.7}
  .carriage input:disabled{opacity:.55}
  .carriage input:focus-visible{box-shadow:0 1px 0 var(--ribbon)}

  /* screen-reader only live region */
  .sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0 0 0 0); white-space:nowrap; border:0}

  @media (max-width:560px){
    .head,.roll,.carriage{padding-left:40px; padding-right:40px}
    .paper::before,.paper::after,
    .paper{background-size:auto}
    .head .meta{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .caret{animation:none}
  }
</style>
</head>
<body>
  <main class="paper" role="application" aria-label="ELIZA conversation">
    <header class="head">
      <span><b>ELIZA</b> · DOCTOR script</span>
      <span class="meta" id="meta">running in webassembly</span>
    </header>
    <div class="roll" id="roll"></div>
    <form class="carriage" id="form" autocomplete="off">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="input" type="text" aria-label="Your reply to ELIZA"
             placeholder="type your reply and press enter" disabled>
    </form>
  </main>
  <div class="sr" id="live" aria-live="polite"></div>

  el.className = 'line you';
  const p = document.createElement('span'); p.className='prompt'; p.textContent='>';
  el.appendChild(p);
  el.appendChild(document.createTextNode(text));
  roll.appendChild(el);
  scrollDown();
}

function announce(text){ live.textContent = text; }

// Print an ELIZA line with a teletype reveal. Returns a promise that resolves
// when the line is fully printed.
function printEliza(text){
  return new Promise((resolve)=>{
    const el = document.createElement('p');
    el.className = 'line eliza';
    const tag = document.createElement('span'); tag.className='tag'; tag.textContent='ELIZA';
    el.appendChild(tag);
    const body = document.createElement('span'); el.appendChild(body);
    const caret = document.createElement('span'); caret.className='caret';
    el.appendChild(caret);
    roll.appendChild(el);
    announce(text);                 // one clean screen-reader announcement
    scrollDown();

    if(reduce){
      body.textContent = text;
      caret.remove();
      resolve(); return;
    }
    let i = 0;
    (function step(){
      if(i >= text.length){ caret.remove(); resolve(); return; }
      // print a few chars per tick for a brisk teletype cadence
      const burst = 1 + (text.charCodeAt(i) === 32 ? 1 : 0);
      body.textContent += text.slice(i, i+burst);
      i += burst;
      scrollDown();
      setTimeout(step, 14 + Math.random()*14);
    })();
  });
}

async function turn(text){
  printYou(text);
  input.disabled = true;
  const reply = ask(text);
  await printEliza(reply);
  input.disabled = false;
  input.focus();
  scrollDown();
}

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const text = input.value.trim();
  if(!text || input.disabled) return;
  input.value = '';
  turn(text);
});

(async function boot(){
  try{
    const bytes = bytesFromB64(WASM_B64);
    const mod = await WebAssembly.compile(bytes);
    const imports = {};
    for(const im of WebAssembly.Module.imports(mod)){
      (imports[im.module] ||= {});
      imports[im.module][im.name] =
        im.name === 'seed'  ? () => 0 :
        im.name === 'abort' ? (m,f,l,c)=>{ throw new Error('abort@'+l+':'+c); } :
        () => {};
    }
    const inst = await WebAssembly.instantiate(mod, imports);
    ex = inst.exports;
    meta.textContent = 'wasm · ' + WASM_KB + ' kb';
    await printEliza(readOut(ex.greeting()));
    input.disabled = false;
    input.focus();
  }catch(err){
    const el = document.createElement('p');
    el.className = 'line sys';
    el.textContent = 'The engine did not load (' + (err && err.message || err) +
                     '). Reload the page to try again.';
    roll.appendChild(el);
  }
})();
</script>
